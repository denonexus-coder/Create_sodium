name: Build
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Is this a release build?
        type: boolean
        required: true
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Read from the repository secrets so the publish steps can tell whether they run
      # in a repository that actually has credentials (upstream does, a fork does not).
      # It has to live at the job level: the secrets context is not available in a
      # step's if, and using it there makes the whole workflow invalid.
      MAVEN_USER: ${{ secrets.MAVEN_USER }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build
        run: ./gradlew build

      # TODO: Enable when gametests work
      # - name: Run Gametests
      #   run: ./gradlew runGametestServer

      - name: Publish to Maven [Releases]
        if: ${{ github.event.inputs.release == 'true' && env.MAVEN_USER != '' }}
        run: >-
          ./gradlew publishAllPublicationsToDevOsReleasesRepository
          -PdevOsReleasesUsername="${{ secrets.MAVEN_USER }}"
          -PdevOsReleasesPassword="${{ secrets.MAVEN_PASS }}"

      - name: Publish to Maven [Snapshots]
        if: ${{ github.event.inputs.release != 'true' && env.MAVEN_USER != '' }}
        run: >-
          ./gradlew publishAllPublicationsToDevOsSnapshotsRepository
          -PdevOsSnapshotsUsername="${{ secrets.MAVEN_USER }}"
          -PdevOsSnapshotsPassword="${{ secrets.MAVEN_PASS }}"

      # TODO: add back CF and MR publishing at some point

      - name: Capture Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
